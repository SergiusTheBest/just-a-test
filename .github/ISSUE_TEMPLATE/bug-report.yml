name: 🐛 Bug Report
description: File a bug report to help us improve
title: "[BUG]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the form below with as much detail as possible.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Tell us what happened...
    validations:
      required: true

  - type: textarea
    id: reproduction-steps
    attributes:
      label: Steps to Reproduce
      description: Provide a step-by-step list of how we can reproduce this behavior.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. Scroll down to '...'
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected Behavior
      description: A clear and concise description of what you expected to happen.
      placeholder: What should have happened?
    validations:
      required: true

  - type: input
    id: environment-os
    attributes:
      label: Operating System (OS)
      description: e.g., Windows 11, macOS Sequoia, Ubuntu 24.04
      placeholder: e.g., macOS
    validations:
      required: false

  - type: dropdown
    id: browser
    attributes:
      label: Browser
      description: If applicable, what browser were you using?
      options:
        - Chrome
        - Firefox
        - Safari
        - Edge
        - Brave
        - Not Applicable / Desktop App
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Before Submitting
      description: Please check the boxes below to confirm you have completed these steps.
      options:
        - label: I have searched existing issues to ensure this bug hasn't already been reported.
          required: true
        - label: I am using the latest version of this software.
          required: true
